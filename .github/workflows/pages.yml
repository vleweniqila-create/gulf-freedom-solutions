name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing, Yandex, Seznam, Naver and other IndexNow search engines the
      # site changed, so they recrawl it quickly. (Google does not use IndexNow;
      # it reads sitemap.xml through Search Console.) Never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=6a8db72c8177c591a5650b1a404043d9
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g' | grep -v '\.jpg$' | sed 's/.*/"&"/' | paste -sd, -)
          sleep 30
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"gulffreedomsolutions.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://gulffreedomsolutions.com/$KEY.txt\",\"urlList\":[$URLS]}"
